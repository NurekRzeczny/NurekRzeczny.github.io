<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Portal - Map Selection</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131c2e',
                        cardHover: '#1e293b',
                        accent: '#6366f1'
                    }
                }
            }
        }
    </script>
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white relative">

    <!-- GAME LOADING SCREEN (LOADER) -->
    <div id="gameLoader" class="fixed inset-0 bg-darkBg/95 backdrop-blur-md z-50 flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="relative flex items-center justify-center">
            <div class="w-16 h-16 border-4 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin"></div>
            <i class="fa-solid fa-gamepad absolute text-indigo-400 text-xl"></i>
        </div>
        <p id="loaderText" class="text-slate-200 font-semibold mt-4 tracking-wider text-sm">Loading Miami...</p>
    </div>

    <!-- HEADER -->
    <header class="w-full px-6 py-4 flex items-center justify-between border-b border-slate-800/80 bg-darkBg/90 backdrop-blur-md sticky top-0 z-40 shadow-lg">
        <!-- Logo -->
        <div class="flex items-center space-x-3 cursor-pointer" onclick="location.reload()">
            <img src="assets/logo.png" alt="Logo" class="w-10 h-10 object-contain rounded-xl shadow-md border border-slate-700 bg-slate-800" onerror="this.src='https://placehold.co/40x40/1e293b/ffffff?text=GP'">
            <span class="font-bold text-lg tracking-wider bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">GAME PORTAL</span>
        </div>

        <!-- Settings Gear Icon -->
        <button onclick="openSettings()" class="w-10 h-10 rounded-xl bg-cardBg border border-slate-700/60 flex items-center justify-center text-slate-300 hover:text-white hover:border-indigo-500 transition-all duration-200 shadow-sm active:scale-95" title="Settings">
            <i class="fa-solid fa-gear text-lg"></i>
        </button>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-8 flex flex-col items-center">
        
        <!-- SEARCH BAR -->
        <div class="w-full max-w-2xl mb-10 relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-magnifying-glass text-lg"></i>
            </div>
            <input type="text" id="searchInput" oninput="filterMaps()" placeholder="Search maps..." 
                class="w-full pl-12 pr-4 py-4 bg-cardBg/90 border border-slate-700/80 rounded-2xl text-slate-100 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 shadow-xl transition-all duration-200 text-base">
        </div>

        <!-- MAPS GRID (2 columns on mobile, 3 columns on desktop) -->
        <div id="mapsGrid" class="w-full grid grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6 max-w-5xl">
            
            <!-- CARD 1: MIAMI -->
            <div class="map-card group relative bg-cardBg rounded-2xl overflow-hidden border border-slate-800 hover:border-indigo-500/50 transition-all duration-300 shadow-xl hover:shadow-2xl hover:shadow-indigo-500/10 cursor-pointer flex flex-col" data-name="miami" data-id="miami" data-order="1" onclick="launchMap('miami', 'subwaysurfers/miami/miami.html')">
                <div class="relative w-full h-40 sm:h-52 overflow-hidden bg-gradient-to-br from-slate-800 via-indigo-950 to-slate-900">
                    <img src="assets/miami.png" alt="Miami" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-90" onerror="this.src='https://placehold.co/600x400/1e293b/ffffff?text=Miami'">
                    <div class="absolute inset-0 bg-gradient-to-t from-cardBg via-transparent to-black/30"></div>
                    
                    <button onclick="toggleFavorite(event, 'miami')" class="absolute top-3 right-3 w-9 h-9 rounded-xl bg-slate-900/70 backdrop-blur-md border border-slate-700/60 flex items-center justify-center text-slate-300 hover:text-amber-400 hover:border-amber-400/50 transition-all shadow-md active:scale-90 z-10" title="Favorite">
                        <i id="fav-icon-miami" class="fa-regular fa-star text-sm"></i>
                    </button>
                </div>

                <div class="p-4 sm:p-5 flex flex-col justify-between flex-1">
                    <div>
                        <h3 class="text-base sm:text-lg font-bold text-white group-hover:text-indigo-400 transition-colors">Miami</h3>
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mt-1">• ORIGINAL</p>
                    </div>
                </div>
            </div>

            <!-- CARD 2: MAP 2 -->
            <div class="map-card group relative bg-cardBg rounded-2xl overflow-hidden border border-slate-800 hover:border-indigo-500/50 transition-all duration-300 shadow-xl hover:shadow-2xl hover:shadow-indigo-500/10 cursor-pointer flex flex-col" data-name="map 2" data-id="map-2" data-order="2" onclick="launchMap('map-2', 'subwaysurfers/map2/index.html')">
                <div class="relative w-full h-40 sm:h-52 overflow-hidden bg-gradient-to-br from-slate-800 via-indigo-950 to-slate-900">
                    <img src="https://placehold.co/600x400/1e293b/334155?text=Map+2" alt="Map 2" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-90" onerror="this.src='https://placehold.co/600x400/1e293b/ffffff?text=Map+2'">
                    <div class="absolute inset-0 bg-gradient-to-t from-cardBg via-transparent to-black/30"></div>
                    
                    <button onclick="toggleFavorite(event, 'map-2')" class="absolute top-3 right-3 w-9 h-9 rounded-xl bg-slate-900/70 backdrop-blur-md border border-slate-700/60 flex items-center justify-center text-slate-300 hover:text-amber-400 hover:border-amber-400/50 transition-all shadow-md active:scale-90 z-10" title="Favorite">
                        <i id="fav-icon-map-2" class="fa-regular fa-star text-sm"></i>
                    </button>
                </div>

                <div class="p-4 sm:p-5 flex flex-col justify-between flex-1">
                    <div>
                        <h3 class="text-base sm:text-lg font-bold text-white group-hover:text-indigo-400 transition-colors">Map 2</h3>
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mt-1">• ORIGINAL</p>
                    </div>
                </div>
            </div>

            <!-- CARD 3: MAP 3 -->
            <div class="map-card group relative bg-cardBg rounded-2xl overflow-hidden border border-slate-800 hover:border-indigo-500/50 transition-all duration-300 shadow-xl hover:shadow-2xl hover:shadow-indigo-500/10 cursor-pointer flex flex-col" data-name="map 3" data-id="map-3" data-order="3" onclick="launchMap('map-3', 'subwaysurfers/map3/index.html')">
                <div class="relative w-full h-40 sm:h-52 overflow-hidden bg-gradient-to-br from-slate-800 via-indigo-950 to-slate-900">
                    <img src="https://placehold.co/600x400/1e293b/334155?text=Map+3" alt="Map 3" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-90" onerror="this.src='https://placehold.co/600x400/1e293b/ffffff?text=Map+3'">
                    <div class="absolute inset-0 bg-gradient-to-t from-cardBg via-transparent to-black/30"></div>
                    
                    <button onclick="toggleFavorite(event, 'map-3')" class="absolute top-3 right-3 w-9 h-9 rounded-xl bg-slate-900/70 backdrop-blur-md border border-slate-700/60 flex items-center justify-center text-slate-300 hover:text-amber-400 hover:border-amber-400/50 transition-all shadow-md active:scale-90 z-10" title="Favorite">
                        <i id="fav-icon-map-3" class="fa-regular fa-star text-sm"></i>
                    </button>
                </div>

                <div class="p-4 sm:p-5 flex flex-col justify-between flex-1">
                    <div>
                        <h3 class="text-base sm:text-lg font-bold text-white group-hover:text-indigo-400 transition-colors">Map 3</h3>
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mt-1">• ORIGINAL</p>
                    </div>
                </div>
            </div>

            <!-- CARD 4: MAP 4 -->
            <div class="map-card group relative bg-cardBg rounded-2xl overflow-hidden border border-slate-800 hover:border-indigo-500/50 transition-all duration-300 shadow-xl hover:shadow-2xl hover:shadow-indigo-500/10 cursor-pointer flex flex-col" data-name="map 4" data-id="map-4" data-order="4" onclick="launchMap('map-4', 'subwaysurfers/map4/index.html')">
                <div class="relative w-full h-40 sm:h-52 overflow-hidden bg-gradient-to-br from-slate-800 via-indigo-950 to-slate-900">
                    <img src="https://placehold.co/600x400/1e293b/334155?text=Map+4" alt="Map 4" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-90" onerror="this.src='https://placehold.co/600x400/1e293b/ffffff?text=Map+4'">
                    <div class="absolute inset-0 bg-gradient-to-t from-cardBg via-transparent to-black/30"></div>
                    
                    <button onclick="toggleFavorite(event, 'map-4')" class="absolute top-3 right-3 w-9 h-9 rounded-xl bg-slate-900/70 backdrop-blur-md border border-slate-700/60 flex items-center justify-center text-slate-300 hover:text-amber-400 hover:border-amber-400/50 transition-all shadow-md active:scale-90 z-10" title="Favorite">
                        <i id="fav-icon-map-4" class="fa-regular fa-star text-sm"></i>
                    </button>
                </div>

                <div class="p-4 sm:p-5 flex flex-col justify-between flex-1">
                    <div>
                        <h3 class="text-base sm:text-lg font-bold text-white group-hover:text-indigo-400 transition-colors">Map 4</h3>
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mt-1">• ORIGINAL</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- No results message -->
        <div id="noResults" class="hidden flex-col items-center justify-center py-16 text-slate-400">
            <i class="fa-solid fa-map-location-dot text-4xl mb-3 text-slate-600"></i>
            <p class="text-lg font-medium">No matching maps found</p>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="w-full py-6 text-center text-xs text-slate-500 border-t border-slate-800/80 bg-darkBg">
        <p>Game Portal WebGL &bull; Version 1.0</p>
    </footer>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-6 right-6 transform translate-y-24 opacity-0 transition-all duration-300 bg-slate-900 border border-slate-700 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 z-50">
        <i id="toastIcon" class="fa-solid fa-circle-check text-indigo-400"></i>
        <span id="toastMessage" class="text-sm font-medium">Notification</span>
    </div>

    <!-- SCRIPT -->
    <script src="app.js"></script>
</body>
</html>
