<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Portal - Wybór Mapy</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131c2e',
                        cardHover: '#1e293b',
                        accent: '#6366f1'
                    }
                }
            }
        }
    </script>
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Własne style CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- HEADER / GÓRNY PASEK -->
    <header class="w-full px-6 py-4 flex items-center justify-between border-b border-slate-800/80 bg-darkBg/90 backdrop-blur-md sticky top-0 z-50 shadow-lg">
        <!-- Logo (z podpięciem pod plik PNG z folderu assets) -->
        <div class="flex items-center space-x-3 cursor-pointer" onclick="location.reload()">
            <img src="assets/logo.png" alt="Logo" class="w-10 h-10 object-contain rounded-xl shadow-md border border-slate-700 bg-slate-800" onerror="this.src='https://placehold.co/40x40/1e293b/ffffff?text=GP'">
            <span class="font-bold text-lg tracking-wider bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">GAME PORTAL</span>
        </div>

        <!-- Ikona zębatki (Ustawienia) -->
        <button onclick="openSettings()" class="w-10 h-10 rounded-xl bg-cardBg border border-slate-700/60 flex items-center justify-center text-slate-300 hover:text-white hover:border-indigo-500 transition-all duration-200 shadow-sm active:scale-95">
            <i class="fa-solid fa-gear text-lg"></i>
        </button>
    </header>

    <!-- GŁÓWNA ZAWARTOŚĆ STRONY -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-8 flex flex-col items-center">
        
        <!-- DUŻY PASEK WYSZUKIWANIA NA ŚRODKU (PONIŻEJ GÓRNEGO PASKA) -->
        <div class="w-full max-w-2xl mb-10 relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-magnifying-glass text-lg"></i>
            </div>
            <input type="text" id="searchInput" oninput="filterMaps()" placeholder="Szukaj mapy..." 
                class="w-full pl-12 pr-4 py-4 bg-cardBg/90 border border-slate-700/80 rounded-2xl text-slate-100 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 shadow-xl transition-all duration-200 text-base">
            <div class="absolute inset-y-0 right-0 pr-4 flex items-center">
                <button onclick="toggleFavoritesFilter()" id="favFilterBtn" title="Pokaż ulubione" class="px-3 py-1.5 rounded-xl bg-slate-800 border border-slate-700 text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-700 transition-all flex items-center space-x-1.5">
                    <i class="fa-regular fa-star text-amber-400"></i>
                    <span class="hidden sm:inline">Ulubione</span>
                </button>
            </div>
        </div>

        <!-- SIATKA KAFELKÓW (MAPY) -->
        <div id="mapsGrid" class="w-full grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 gap-6 max-w-4xl">
            
            <!-- KAFELOK 1: MAPA 1 -->
            <div class="map-card group relative bg-cardBg rounded-2xl overflow-hidden border border-slate-800 hover:border-indigo-500/50 transition-all duration-300 shadow-xl hover:shadow-2xl hover:shadow-indigo-500/10 cursor-pointer flex flex-col" data-name="Mapa 1" data-id="map-1" onclick="launchMap('map-1')">
                <!-- Miniaturka z gradientem/tłem (zgodna ze stylem ze screena) -->
                <div class="relative w-full h-52 sm:h-56 overflow-hidden bg-gradient-to-br from-slate-800 via-indigo-950 to-slate-900">
                    <img src="https://placehold.co/600x400/1e293b/334155?text=Mapa+1" alt="Mapa 1" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-90" onerror="this.src='https://placehold.co/600x400/1e293b/ffffff?text=Mapa+1'">
                    <div class="absolute inset-0 bg-gradient-to-t from-cardBg via-transparent to-black/30"></div>
                    
                    <!-- Przycisk ulubionych (gwiazdka) w prawym rogu kafelka -->
                    <button onclick="toggleFavorite(event, 'map-1')" class="absolute top-3 right-3 w-9 h-9 rounded-xl bg-slate-900/70 backdrop-blur-md border border-slate-700/60 flex items-center justify-center text-slate-300 hover:text-amber-400 hover:border-amber-400/50 transition-all shadow-md active:scale-90 z-10">
                        <i id="fav-icon-map-1" class="fa-regular fa-star text-sm"></i>
                    </button>
                </div>

                <!-- Treść pod miniaturą -->
                <div class="p-5 flex flex-col justify-between flex-1">
                    <div>
                        <h3 class="text-lg font-bold text-white group-hover:text-indigo-400 transition-colors">Mapa 1</h3>
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mt-1">• ORIGINAL</p>
                    </div>
                </div>
            </div>

            <!-- KAFELOK 2: MAPA 2 -->
            <div class="map-card group relative bg-cardBg rounded-2xl overflow-hidden border border-slate-800 hover:border-indigo-500/50 transition-all duration-300 shadow-xl hover:shadow-2xl hover:shadow-indigo-500/10 cursor-pointer flex flex-col" data-name="Mapa 2" data-id="map-2" onclick="launchMap('map-2')">
                <!-- Miniaturka z gradientem/tłem -->
                <div class="relative w-full h-52 sm:h-56 overflow-hidden bg-gradient-to-br from-slate-800 via-indigo-950 to-slate-900">
                    <img src="https://placehold.co/600x400/1e293b/334155?text=Mapa+2" alt="Mapa 2" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-90" onerror="this.src='https://placehold.co/600x400/1e293b/ffffff?text=Mapa+2'">
                    <div class="absolute inset-0 bg-gradient-to-t from-cardBg via-transparent to-black/30"></div>
                    
                    <!-- Przycisk ulubionych (gwiazdka) w prawym rogu kafelka -->
                    <button onclick="toggleFavorite(event, 'map-2')" class="absolute top-3 right-3 w-9 h-9 rounded-xl bg-slate-900/70 backdrop-blur-md border border-slate-700/60 flex items-center justify-center text-slate-300 hover:text-amber-400 hover:border-amber-400/50 transition-all shadow-md active:scale-90 z-10">
                        <i id="fav-icon-map-2" class="fa-regular fa-star text-sm"></i>
                    </button>
                </div>

                <!-- Treść pod miniaturą -->
                <div class="p-5 flex flex-col justify-between flex-1">
                    <div>
                        <h3 class="text-lg font-bold text-white group-hover:text-indigo-400 transition-colors">Mapa 2</h3>
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mt-1">• ORIGINAL</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- Komunikat gdy brak wyników wyszukiwania -->
        <div id="noResults" class="hidden flex-col items-center justify-center py-16 text-slate-400">
            <i class="fa-solid fa-map-location-dot text-4xl mb-3 text-slate-600"></i>
            <p class="text-lg font-medium">Nie znaleziono pasujących map</p>
        </div>

    </main>

    <!-- STOPKA -->
    <footer class="w-full py-6 text-center text-xs text-slate-500 border-t border-slate-800/80 bg-darkBg">
        <p>Game Portal WebGL &bull; Wersja 1.0</p>
    </footer>

    <!-- PROSTE POWIADOMIENIE / MODAL ZAMIAST ALERTU -->
    <div id="toast" class="fixed bottom-6 right-6 transform translate-y-24 opacity-0 transition-all duration-300 bg-slate-900 border border-slate-700 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 z-50">
        <i id="toastIcon" class="fa-solid fa-circle-check text-indigo-400"></i>
        <span id="toastMessage" class="text-sm font-medium">Komunikat</span>
    </div>

    <!-- WŁASNY SKRYPT JS -->
    <script src="app.js"></script>
</body>
</html>
