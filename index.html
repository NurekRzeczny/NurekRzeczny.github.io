<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surfers Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- GÓRNY PASEK -->
    <header class="top-bar">
        <div class="logo-container">
            <!-- Podpięcie pod logo PNG z folderu asset -->
            <img src="asset/logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='block';">
            <span id="fallback-logo" style="display:none; font-weight:800; font-size:1.1rem; letter-spacing:0.05em;">GAME PORTAL</span>
        </div>
        <button class="settings-btn" title="Ustawienia">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>
    </header>

    <!-- WYSZUKIWARKA POZA PASKIEM NA ŚRODKU -->
    <div class="search-container">
        <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" class="search-input" id="searchInput" placeholder="Szukaj mapy...">
        </div>
    </div>

    <!-- KAFELKI MAP -->
    <main class="maps-grid" id="mapsGrid">
        <!-- Mapa 1 -->
        <article class="map-card" data-name="mapa 1">
            <div class="map-info">
                <h2 class="map-title">Mapa 1</h2>
                <span class="map-subtitle">• ORIGINAL</span>
            </div>
            <button class="card-star-btn" title="Dodaj do ulubionych" onclick="toggleFavorite(event, this)">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            </button>
        </article>

        <!-- Mapa 2 -->
        <article class="map-card" data-name="mapa 2">
            <div class="map-info">
                <h2 class="map-title">Mapa 2</h2>
                <span class="map-subtitle">• ORIGINAL</span>
            </div>
            <button class="card-star-btn" title="Dodaj do ulubionych" onclick="toggleFavorite(event, this)">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            </button>
        </article>
    </main>

    <script src="app.js"></script>
</body>
</html>
