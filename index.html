<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subway Surfers Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- GÓRNY PASEK NAWIGACJI -->
  <header class="top-bar">
    <div class="logo-wrapper">
      <img src="asset/logo.png" alt="Logo Portalu" class="brand-logo" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='inline-block';">
      <span id="logo-fallback" class="logo-fallback">PORTAL SBS</span>
    </div>

    <div class="header-actions">
      <button id="fav-filter-btn" class="fav-toggle-btn" title="Pokaż tylko ulubione">
        ★ Ulubione
      </button>
      <button id="settings-btn" class="icon-btn" title="Ustawienia" aria-label="Ustawienia">
        <!-- Ikona zębatki SVG -->
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- GŁÓWNA ZAWARTOŚĆ -->
  <main class="container">
    
    <!-- DUŻA WYSZUKIWARKA PONIŻEJ PASKA NA ŚRODKU -->
    <section class="search-section">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="map-search-input" placeholder="Szukaj mapy..." autocomplete="off">
      </div>
    </section>

    <!-- SIATKA KAFELKÓW Z MAPAMI -->
    <section class="maps-grid" id="maps-grid">
      
      <!-- Kafelek: Mapa 1 -->
      <article class="map-card" data-id="mapa1" data-name="Mapa 1">
        <div class="card-bg" style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);"></div>
        <div class="card-overlay"></div>
        <div class="card-content">
          <div class="card-info">
            <h2 class="map-title">Mapa 1</h2>
            <span class="map-tag">• ORIGINAL</span>
          </div>
          <button class="star-btn" data-fav="mapa1" title="Dodaj do ulubionych" aria-label="Ulubione">★</button>
        </div>
      </article>

      <!-- Kafelek: Mapa 2 -->
      <article class="map-card" data-id="mapa2" data-name="Mapa 2">
        <div class="card-bg" style="background: linear-gradient(135deg, #27272a 0%, #18181b 100%);"></div>
        <div class="card-overlay"></div>
        <div class="card-content">
          <div class="card-info">
            <h2 class="map-title">Mapa 2</h2>
            <span class="map-tag">• ORIGINAL</span>
          </div>
          <button class="star-btn" data-fav="mapa2" title="Dodaj do ulubionych" aria-label="Ulubione">★</button>
        </div>
      </article>

    </section>

    <p id="empty-state" class="empty-state" style="display: none;">Nie znaleziono mapy pasującej do wyszukiwania.</p>
  </main>

  <!-- OKNO USTAWIEŃ (MODAL) -->
  <div id="settings-modal" class="modal-backdrop" style="display: none;">
    <div class="modal-window">
      <div class="modal-header">
        <h3>Ustawienia portalu</h3>
        <button id="close-modal-btn" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <p class="modal-note">Tutaj w przyszłości podepniesz globalne opcje (np. domyślną rozdzielczość okna gry, widoczność KeyOverlay lub reset zapisanych wyników).</p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
